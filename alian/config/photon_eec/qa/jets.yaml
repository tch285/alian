constants:
  twopi: &twopi 6.28318530718

# Event cuts
selections:
  event:
    event_sel: sel8
    trig_sel: GammaHighPtEMCAL, GammaHighPtDCAL
    rct: CBT_calo
  track:
    pt_min: 0.150
    track_sel: globalTrack

jet_finder:
  R: 0.4
  alg: antikt
  pT_min: 10

analysis:

output:
  bins:
    pT: ['lin', 0, 200, 200]
    phi: ['lin', 0, *twopi, 100]
    eta: ['lin', -1, 1, 100]
    pT_custom: ['c', [0.15, 0.5, 1, 5, 10, 15, 20, 30, 40, 50, 60, 100, 200]]
  histograms:
    pT: [1, "pT", "Jet #it{p}_{T} spectrum;jet #it{p}_{T} (GeV);Counts", pT]
    phi: [1, "phi", "Jet #phi distribution;#phi_{jet};Counts", phi]
    eta: [1, "eta", "Jet #eta distribution;#eta_{jet};Counts", eta]
    eta_phi:  [2, "eta_phi", "Jet angular distribution;#eta;#phi", eta, phi]
    eta_phi_pT:  [3, "eta_phi_pT", "Jet angular distribution;#eta;#phi;#it{p}_{T}", eta, phi, pT_custom]

