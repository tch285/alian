# to be used with alian/analysis/example/example_analysis_mc.py
constants: # a YAML hack to define constants
  pi: &twopi 6.28318531

# Event cuts
selections:
  event:
    event_sel: selMC
    rct: CBT
  track:
    pt_min: 0.150
    track_sel: globalTrack

# remove the jet_finder section below if jets are not needed in analysis
jet_finder:
  R: 0.4
  alg: antikt
  pT_min: 10

analysis:
  pt_min_eec: 1.0

output:
  bins:
    jet_pT: ['lin', 0, 200, 200]
    jet_pT_coarse: ['lin', 0, 200, 40]
    jet_eta: ['lin', -1, 1, 100]
    jet_phi: ['lin', 0, *twopi, 100]
    res: ['lin', -10, 10, 80]
  histograms:
    # define histograms with bins described in `bins`
    jet_pT_det: [1, "jet_pT_det", "Det. jet #it{p}_{T} spectrum;det. jet #it{p}_{T} (GeV);Counts", jet_pT]
    jet_pT_gen: [1, "jet_pT_gen", "Gen. jet #it{p}_{T} spectrum;gen. jet #it{p}_{T} (GeV);Counts", jet_pT]
    jet_pT_det_matched: [1, "jet_pT_det_matched", "Matched det. jet #it{p}_{T} spectrum;det. jet #it{p}_{T} (GeV);Counts", jet_pT]
    jet_pT_gen_matched: [1, "jet_pT_gen_matched", "Matched gen. jet #it{p}_{T} spectrum;gen. jet #it{p}_{T} (GeV);Counts", jet_pT]
    jet_eta_det: [1, "jet_eta_det", "Det. jet #eta distribution;det. jet #eta (GeV);Counts", jet_eta]
    jet_eta_gen: [1, "jet_eta_gen", "Gen. jet #eta distribution;gen. jet #eta (GeV);Counts", jet_eta]
    jet_eta_det_matched: [1, "jet_eta_det_matched", "Matched det. jet #eta distribution;det. jet #eta (GeV);Counts", jet_eta]
    jet_eta_gen_matched: [1, "jet_eta_gen_matched", "Matched gen. jet #eta distribution;gen. jet #eta (GeV);Counts", jet_eta]
    jet_phi_det: [1, "jet_phi_det", "Det. jet #phi distribution;det. jet #phi (GeV);Counts", jet_phi]
    jet_phi_gen: [1, "jet_phi_gen", "Gen. jet #phi distribution;gen. jet #phi (GeV);Counts", jet_phi]
    jet_phi_det_matched: [1, "jet_phi_det_matched", "Matched det. jet #phi distribution;det. jet #phi (GeV);Counts", jet_phi]
    jet_phi_gen_matched: [1, "jet_phi_gen_matched", "Matched gen. jet #phi distribution;gen. jet #phi (GeV);Counts", jet_phi]
    jet_eta_phi_det:  [2, "jet_eta_phi_det", "Det. jet angular distribution;#eta;#phi", jet_eta, jet_phi]
    jet_eta_phi_gen:  [2, "jet_eta_phi_gen", "Gen. jet angular distribution;#eta;#phi", jet_eta, jet_phi]
    jet_eta_phi_det_matched:  [2, "jet_eta_phi_det_matched", "Matched det. jet angular distribution;#eta;#phi", jet_eta, jet_phi]
    jet_eta_phi_gen_matched:  [2, "jet_eta_phi_gen_matched", "Matched gen. jet angular distribution;#eta;#phi", jet_eta, jet_phi]
    jet_eta_phi_pT_det:  [3, "jet_eta_phi_pT_det", "Det. jet angular distribution;#eta;#phi;jet #it{p}_{T}", jet_eta, jet_phi, jet_pT_coarse]
    jet_eta_phi_pT_gen:  [3, "jet_eta_phi_pT_gen", "Gen. jet angular distribution;#eta;#phi;jet #it{p}_{T}", jet_eta, jet_phi, jet_pT_coarse]
    jet_eta_phi_pT_det_matched:  [3, "jet_eta_phi_pT_det_matched", "Matched det. jet angular distribution;#eta;#phi;jet #it{p}_{T}", jet_eta, jet_phi, jet_pT_coarse]
    jet_eta_phi_pT_gen_matched:  [3, "jet_eta_phi_pT_gen_matched", "Matched gen. jet angular distribution;#eta;#phi;jet #it{p}_{T}", jet_eta, jet_phi, jet_pT_coarse]
    jet_pT_res:  [2, "jet_pT_res", "Jet #it{p}_{T} resolution;#it{p}_{T} (GeV);Resolution (%)", jet_pT_coarse, res]
    jet_pT_resp: [2, "jet_pT_resp", "Jet #it{p}_{T} response matrix;det. jet #it{p}_{T} (GeV);gen. jet #it{p}_{T} (GeV)", jet_pT, jet_pT]
