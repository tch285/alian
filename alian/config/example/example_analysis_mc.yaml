# to be used with alian/analysis/example/example_analysis_mc.py
constants: # a YAML hack to define constants
  pi34: &pi34 2.35619449019
  halfpi: &pihalf 1.57079632679
  pi: &pi 3.14159265359

# Event cuts
selections:
  event:
    event_sel: sel8
    rct: CBT
  track:
    pt_min: 0.150
    track_sel: globalTrack

# remove the jet_finder section below if jets are not needed in analysis
jet_finder:
  R: 0.4
  alg: antikt
  pT_min: 10

analysis:
  pt_min_eec: 1.0

output:
  bins:
    track_pT: ['log', 0.1, 20, 300]
    track_pT_coarse: ['log', 0.1, 20, 20]
    jet_pT: ['lin', 0, 200, 200]
    RL: ['log', 1.0e-3, 1, 30]
    res: ['lin', -4, 4, 20]
  histograms:
    # define histograms with bins described in `bins`
    track_pT_det: [1, "track_pT_det", "Det. track #it{p}_{T} spectrum;#it{p}_{T} (GeV);dN/d#it{p}_{T}", track_pT]
    track_pT_gen: [1, "track_pT_gen", "Gen. track #it{p}_{T} spectrum;#it{p}_{T} (GeV);dN/d#it{p}_{T}", track_pT]
    eff_track_pT_det: [1, "eff_track_pT_det", "Det. track #it{p}_{T} spectrum;#it{p}_{T} (GeV);dN/d#it{p}_{T}", track_pT_coarse]
    eff_track_pT_gen: [1, "eff_track_pT_gen", "Gen. track #it{p}_{T} spectrum;#it{p}_{T} (GeV);dN/d#it{p}_{T}", track_pT_coarse]
    pur_track_pT_det: [1, "pur_track_pT_det", "Det. track #it{p}_{T} spectrum;#it{p}_{T} (GeV);dN/d#it{p}_{T}", track_pT_coarse]
    pur_track_pT_gen: [1, "pur_track_pT_gen", "Gen. track #it{p}_{T} spectrum;#it{p}_{T} (GeV);dN/d#it{p}_{T}", track_pT_coarse]
    ch_track_pT_gen: [1, "ch_track_pT_gen", "Gen. track #it{p}_{T} spectrum;#it{p}_{T} (GeV);dN/d#it{p}_{T}", track_pT_coarse]
    ch_track_pT_det: [1, "ch_track_pT_det", "Det. track #it{p}_{T} spectrum;#it{p}_{T} (GeV);dN/d#it{p}_{T}", track_pT_coarse]
    pT_res: [2, "pT_res", "#it{p}_{T} resolution;#it{p}_{T} (GeV);Resolution (%)", track_pT_coarse, res]
    jet_pT_det: [1, "jet_pT_det", "Det. jet #it{p}_{T} spectrum;jet #it{p}_{T} (GeV);Counts", jet_pT]
    jet_pT_gen: [1, "jet_pT_gen", "Gen. jet #it{p}_{T} spectrum;jet #it{p}_{T} (GeV);Counts", jet_pT]
    eec_det: [2, "eec_det", "EEC (det);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
    eec_gen: [2, "eec_gen", "EEC (gen);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
